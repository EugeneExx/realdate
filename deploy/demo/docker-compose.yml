name: realdate-demo

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      OTP_PROVIDER: console
      ADMIN_PHONE: ${ADMIN_PHONE}
      ADMIN_PHONES: ${ADMIN_PHONES}
      CORS_ORIGINS: https://${DEMO_DOMAIN}
      EVENT_TIMEZONE: Asia/Vladivostok
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 20s
      timeout: 5s
      retries: 8
    networks:
      default:
      gateway:
        aliases:
          - realdate-demo-api

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: /api
        VITE_PUBLIC_SITE_URL: https://${DEMO_DOMAIN}
        VITE_LEGAL_NAME: ${LEGAL_NAME}
        VITE_LEGAL_INN: ${LEGAL_INN}
        VITE_LEGAL_ADDRESS: ${LEGAL_ADDRESS}
        VITE_SUPPORT_PHONE: ${SUPPORT_PHONE}
        VITE_SUPPORT_EMAIL: ${SUPPORT_EMAIL}
        VITE_SUPPORT_TELEGRAM: ${SUPPORT_TELEGRAM}
        VITE_DOCUMENTS_EFFECTIVE_DATE: ${DOCUMENTS_EFFECTIVE_DATE}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    networks:
      default:
      gateway:
        aliases:
          - realdate-demo-web

volumes:
  postgres_data:
  uploads:

networks:
  gateway:
    external: true
    name: realdate_default
