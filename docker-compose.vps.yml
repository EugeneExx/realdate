services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      OTP_PROVIDER: ${OTP_PROVIDER:-telegram}
      TELEGRAM_GATEWAY_TOKEN: ${TELEGRAM_GATEWAY_TOKEN:-}
      TELEGRAM_SENDER_USERNAME: ${TELEGRAM_SENDER_USERNAME:-}
      TELEGRAM_GATEWAY_CALLBACK_URL: ${TELEGRAM_GATEWAY_CALLBACK_URL:-}
      TELEGRAM_GATEWAY_LOW_BALANCE_THRESHOLD: ${TELEGRAM_GATEWAY_LOW_BALANCE_THRESHOLD:-1.00}
      OTP_IP_HOURLY_LIMIT: ${OTP_IP_HOURLY_LIMIT:-30}
      OTP_PHONE_HOURLY_LIMIT: ${OTP_PHONE_HOURLY_LIMIT:-5}
      OTP_RESEND_SECONDS: ${OTP_RESEND_SECONDS:-60}
      SMSRU_API_ID: ${SMSRU_API_ID:-}
      SMSRU_FROM: ${SMSRU_FROM:-}
      SMSAERO_EMAIL: ${SMSAERO_EMAIL:-}
      SMSAERO_API_KEY: ${SMSAERO_API_KEY:-}
      SMSAERO_SIGN: ${SMSAERO_SIGN:-SMSAero}
      ADMIN_PHONE: ${ADMIN_PHONE}
      ADMIN_PHONES: ${ADMIN_PHONES:-}
      CORS_ORIGINS: https://${DOMAIN}
      EVENT_TIMEZONE: ${EVENT_TIMEZONE:-Asia/Khabarovsk}
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 8
    networks:
      default:
      proxy:
        aliases:
          - realdate-api

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: /api
        VITE_PUBLIC_SITE_URL: https://${DOMAIN}
        VITE_LEGAL_NAME: ${LEGAL_NAME:-}
        VITE_LEGAL_INN: ${LEGAL_INN:-}
        VITE_LEGAL_ADDRESS: ${LEGAL_ADDRESS:-}
        VITE_SUPPORT_PHONE: ${SUPPORT_PHONE:-+79990800137}
        VITE_SUPPORT_EMAIL: ${SUPPORT_EMAIL:-}
        VITE_SUPPORT_TELEGRAM: ${SUPPORT_TELEGRAM:-katy_sha_00}
        VITE_DOCUMENTS_EFFECTIVE_DATE: ${DOCUMENTS_EFFECTIVE_DATE:-}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    networks:
      default:
      proxy:
        aliases:
          - realdate-web

volumes:
  postgres_data:
  uploads:

networks:
  proxy:
    external: true
    name: public-proxy
