services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: realdate
      POSTGRES_USER: realdate
      POSTGRES_PASSWORD: realdate
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U realdate"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://realdate:realdate@db:5432/realdate
      JWT_SECRET: ${JWT_SECRET:-local-development-secret}
      OTP_PROVIDER: console
      ADMIN_PHONE: ${ADMIN_PHONE:-+79990000000}
      ADMIN_PHONES: ${ADMIN_PHONES:-}
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    volumes:
      - ./backend/app:/app/app
      - uploads:/app/uploads
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:8000/api
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  postgres_data:
  uploads:
